spring.application.name=worker
server.port=8081
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vigil}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
vigil.concurrency=${WORKER_CONCURRENCY:50}
vigil.connect-timeout=${CHECK_CONNECT_TIMEOUT_MS:3000}
vigil.request-timeout=${CHECK_TIMEOUT_MS:5000}
vigil.stale-threshold=${STALE_JOB_MS:120000}
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,db,redis
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT_MS:7000}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:2000}

