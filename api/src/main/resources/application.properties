spring.application.name=api
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vigil}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.jpa.hibernate.ddl-auto=validate
spring.data.redis.password=${REDIS_PASSWORD}
vigil.check-interval-ms=${CHECK_INTERVAL_MS:60000}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.show-details=always
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT_MS:7000ms}
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:2000ms}

